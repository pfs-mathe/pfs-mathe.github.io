<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe-Wochenplan · Paula-Fürst-Schule</title>
<style>
  :root{
    --bg:#f4f6fb; --ink:#15202b; --muted:#657085;
    --line:#e2e7f0; --accent:#1f4e9c; --accent-soft:#e9f0fb; --radius:14px;
    --k4:#0e7490; --k5:#7c3aed; --k6:#b3283f; --wahl:#b8791a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
       background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45}
  button{font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff;
         border-radius:10px; padding:7px 12px; color:var(--ink)}
  button:hover{background:#eef3fb; border-color:#c3d3ec}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover{background:#173e7d}
  button.ghost{border-color:transparent; background:transparent; padding:4px 7px; color:var(--muted)}
  button.ghost:hover{background:#eaf0fa; color:var(--ink)}
  button.mini{padding:2px 7px; font-size:13px; border-radius:8px}
  input,textarea,select{font:inherit; color:inherit; border:1px solid var(--line);
         border-radius:9px; padding:7px 9px; background:#fff; width:100%}
  input:focus,textarea:focus,select:focus{outline:2px solid #b9cdec; border-color:#b9cdec}
  textarea{resize:vertical; min-height:38px}
  label.f{display:block; font-size:12px; font-weight:600; color:var(--muted);
          text-transform:uppercase; letter-spacing:.04em; margin:0 0 4px}
  .row{display:flex; gap:10px; align-items:center}
  .grow{flex:1}
  .muted{color:var(--muted)} .small{font-size:13px}

  header.top{position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line);
       display:flex; align-items:center; gap:12px; padding:9px 16px; flex-wrap:wrap}
  header.top img.logo{height:34px; width:auto}
  .titel{font-weight:700; font-size:16px; white-space:nowrap; border-left:1px solid var(--line); padding-left:12px}
  .titel span{color:var(--accent)}
  .savestate{font-size:12px; color:var(--muted); min-width:96px}
  .ver{font-size:12px; font-weight:700; color:#fff; background:var(--accent);
       border-radius:999px; padding:2px 10px; white-space:nowrap}
  .pubstate{font-size:12.5px; font-weight:600; color:#0f8a55; white-space:nowrap}
  .pubstate.offen{color:#b8791a}
  button.offen{background:#b8791a; border-color:#b8791a; color:#fff}
  button.offen:hover{background:#9c6715; border-color:#9c6715}
  .toolbar{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}

  nav.tabs{display:flex; gap:6px; padding:10px 16px 0; background:var(--bg); flex-wrap:wrap}
  nav.tabs button{border:1px solid var(--line); border-bottom:none; border-radius:12px 12px 0 0;
       background:#e9edf5; color:var(--muted); font-weight:600}
  nav.tabs button.active{background:#fff; color:var(--ink); box-shadow:0 -2px 0 var(--accent) inset}

  main{padding:0 16px 60px}
  .panel{background:#fff; border:1px solid var(--line); border-radius:0 var(--radius) var(--radius) var(--radius);
       padding:16px; min-height:60vh}
  .cols{display:grid; grid-template-columns:262px 1fr; gap:18px; align-items:start}
  @media (max-width:900px){ .cols{grid-template-columns:1fr} }

  .side h3{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  .weeklist{display:flex; flex-direction:column; gap:6px; max-height:48vh; overflow:auto; padding-right:2px}
  .weekitem{border:1px solid var(--line); border-radius:11px; padding:8px 10px; background:#fbfcfe; text-align:left}
  .weekitem:hover{background:#eef3fb}
  .weekitem.active{border-color:var(--accent); background:var(--accent-soft)}
  .weekitem b{display:block; font-size:14px}
  .weekitem em{font-style:normal; font-size:12px; color:var(--muted)}
  .side .setting{margin-bottom:8px}
  .einst{margin-top:16px; border:1px solid var(--line); border-radius:11px; background:#fbfcfe}
  .einst > summary{cursor:pointer; padding:9px 11px; font-size:12px; font-weight:700; color:var(--muted);
                   text-transform:uppercase; letter-spacing:.05em; list-style:none}
  .einst > summary::-webkit-details-marker{display:none}
  .einst > summary::before{content:"▸ "; }
  .einst[open] > summary::before{content:"▾ "; }
  .einst > div{padding:0 11px 11px}

  .head-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; margin-bottom:16px}
  .gilt{display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:#f6f9fe;
        border:1px solid var(--line); border-radius:11px; padding:9px 12px; margin-bottom:16px}
  .gilt label{display:inline-flex; gap:7px; align-items:center; cursor:pointer; font-weight:600}
  .gilt input{width:auto}

  .block{border:1px solid var(--line); border-left:6px solid var(--fc,#999);
        border-radius:12px; padding:12px; margin-bottom:12px; background:#fdfdff}
  .block-head{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
  .block-head input.name{max-width:260px; font-weight:700}
  .swatch{width:26px; height:26px; padding:0; border-radius:8px; border:1px solid var(--line); cursor:pointer}
  .task{display:grid; grid-template-columns:118px 74px 1fr 175px auto; gap:8px; align-items:start; margin-bottom:8px}
  @media (max-width:960px){ .task{grid-template-columns:1fr 1fr} .task textarea{grid-column:1/-1} }
  @media (max-width:620px){
    body{font-size:16px}
    header.top{padding:8px 10px; gap:8px}
    header.top img.logo{height:26px}
    .titel{font-size:15px; padding-left:8px}
    .toolbar{gap:6px; width:100%; margin-left:0}
    .toolbar button{flex:1 1 46%; padding:9px 8px; font-size:14px}
    nav.tabs{padding:8px 10px 0; gap:4px}
    nav.tabs button{flex:1; padding:9px 6px; font-size:13.5px; text-align:center}
    main{padding:0 10px 50px}
    .panel{padding:12px 10px; border-radius:12px}
    .task{grid-template-columns:1fr 1fr; gap:7px}
    .task .acts{grid-column:1/-1; justify-content:flex-end; gap:6px}
    .task .acts button{padding:6px 12px}
    .block{padding:10px 9px}
    .block-head input.name{max-width:none; flex:1 1 100%}
    .head-grid{grid-template-columns:1fr 1fr}
    .weeklist{max-height:32vh}
    input,textarea,select{font-size:16px}      /* verhindert das Hineinzoomen auf dem iPhone */
  }
  .task .acts{display:flex; gap:2px; align-items:center}
  .task .anh{grid-column:1/-1; display:flex; gap:6px; align-items:center; flex-wrap:wrap;
             margin:-2px 0 6px; padding-left:2px}
  .anhchip{display:inline-flex; align-items:center; gap:6px; background:#eef3fb; border:1px solid #cfdcf1;
           color:#1f4e9c; border-radius:999px; padding:2px 6px 2px 10px; font-size:13px; max-width:320px}
  .anhchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .anhchip button{border:none; background:none; color:#7a8497; padding:0 3px; font-size:14px; line-height:1}
  .anhchip button:hover{color:#b3283f; background:none}
  .task select.art{font-weight:600}

  .stud{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fdfdff}
  .stud-head{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
  .stud-head input.nm{max-width:220px; font-weight:600}
  .stud-head select{width:auto}
  .klhead{display:flex; align-items:baseline; gap:10px; margin:18px 0 8px}
  .klhead h2{margin:0; font-size:17px}
  .taskpick{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
        border-radius:999px; padding:4px 11px; font-size:13px; background:#fff; cursor:pointer; user-select:none}
  .chip.off{opacity:.42; text-decoration:line-through}
  .chip.fremd{opacity:.3; cursor:default; font-style:italic}
  .chip i{width:9px; height:9px; border-radius:50%; background:var(--fc,#999); display:inline-block}

  .hint{background:#fff8e6; border:1px solid #f3dda3; color:#7a5a12; border-radius:11px;
        padding:10px 12px; font-size:13.5px; margin-bottom:14px}
  .empty{color:var(--muted); font-style:italic; padding:14px 0}

  .printopts{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:12px;
              background:#f6f9fe; border:1px solid var(--line); border-radius:12px; padding:11px 12px}
  .printopts label.cb{display:inline-flex; gap:7px; align-items:center; font-size:14px; cursor:pointer}
  .printopts input[type=checkbox]{width:auto}
  .preview{background:#e7ebf3; padding:18px; border-radius:12px; overflow:auto}

  /* ---------- Der Plan ---------- */
  .plan{background:#fff; width:190mm; min-height:272mm; margin:0 auto 18px; padding:11mm 12mm 9mm;
        box-shadow:0 2px 10px rgba(0,0,0,.12); font-size:11pt; display:flex; flex-direction:column}
  .p-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
        border-bottom:2.5px solid #111; padding-bottom:7px}
  .p-top img{height:18mm; width:auto}
  .p-title{text-align:right}
  .p-title h1{margin:0; font-size:21pt; letter-spacing:-.4px; line-height:1}
  .p-title .fach{font-size:13pt; font-weight:600; color:#333}
  .p-title .kl{font-size:10.5pt; color:#555; margin-top:2px}
  .p-name{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:9px 0 2px}
  .p-name .nm{font-size:14pt; font-weight:700}
  .p-name .nmline{flex:1; border-bottom:1px solid #99a; height:15px}
  .p-meta{display:flex; gap:8px; flex-wrap:wrap; margin:9px 0 12px; font-size:10.5pt}
  .p-meta div{background:#f1f4fa; border:1px solid #e3e8f2; border-radius:7px; padding:3px 10px}
  .p-meta b{color:#4a5568; font-weight:600}
  .p-thema{font-size:12.5pt; font-weight:700; margin:0 0 10px}
  .p-block{margin-bottom:10px; border:1px solid #d8dee9; border-left:7px solid var(--fc,#888);
          border-radius:8px; padding:7px 10px 8px; break-inside:avoid; page-break-inside:avoid}
  .p-block h2{margin:0 0 5px; font-size:12pt; display:flex; justify-content:space-between; align-items:baseline}
  .p-block h2 .anz{font-size:9pt; font-weight:600; color:#7b8494}
  .p-task{padding:4px 0; border-top:1px dotted #dfe4ec; break-inside:avoid; page-break-inside:avoid}
  .p-task:first-of-type{border-top:none}
  .p-kopf{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap}
  .p-buch{display:flex; align-items:baseline; gap:6px; font-size:11pt; font-weight:700; margin:2px 0 3px}
  .p-anh{font-size:9pt; color:#3d4657; padding:1px 0 1px 24px}
  .p-anh b{font-weight:600}
  .p-kopf .p-self, .p-buch .p-self{margin-left:auto}
  .p-zeile{display:flex; gap:8px; align-items:flex-start; padding:1.5px 0 1.5px 3px}
  .p-box{flex:0 0 auto; width:13px; height:13px; border:1.5px solid #444; border-radius:3px; margin-top:2.5px}
  .p-txt{flex:1}
  .p-niv{font-size:9pt; color:#1f4e9c; letter-spacing:1px; margin-left:5px; white-space:nowrap}
  .p-art{font-size:8.5pt; font-weight:700; color:#fff; background:#8a93a3; border-radius:5px;
         padding:1px 7px; margin-right:6px; white-space:nowrap}
  .p-art.hinten{margin-right:0; margin-left:6px; font-size:8pt; font-weight:600;
         text-transform:uppercase; letter-spacing:.06em}
  .p-self{flex:0 0 auto; display:flex; gap:5px; margin-top:2px}
  .p-self span{width:12px; height:12px; border:1.2px solid #8a93a3; border-radius:50%}
  .p-selfhead{font-size:8pt; color:#7b8494; text-align:right; margin:-2px 0 2px}
  .p-note{border:1px solid #cfd6e2; border-radius:8px; padding:7px 10px; margin-top:9px; background:#fcfdff;
          break-inside:avoid}
  .p-note h3{margin:0 0 3px; font-size:10.5pt}
  .p-lines div{border-bottom:1px solid #c9d0dc; height:19px}
  .p-foot{margin-top:auto; padding-top:12px}
  .p-online{display:flex; align-items:center; gap:9px; border:1px solid #cfd6e2; border-radius:8px;
            padding:6px 9px; margin-bottom:9px; background:#fcfdff}
  .p-online img{height:19mm; width:auto; display:block}
  .p-online .t{font-size:9.5pt; color:#3d4657; line-height:1.35}
  .p-online .t b{display:block; font-size:11pt; color:#15202b; letter-spacing:.2px}
  .p-legend{font-size:8.5pt; color:#5d6675; margin-bottom:8px}
  .p-legend b{display:inline-block; width:11px; height:11px; border:1.2px solid #8a93a3; border-radius:50%;
              vertical-align:-1px; margin:0 3px 0 6px}
  .p-sign{display:flex; gap:22px; font-size:9.5pt; color:#333}
  .p-sign div{flex:1; border-top:1px solid #999; padding-top:3px}

  #toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#15202b; color:#fff;
    padding:11px 18px; border-radius:12px; font-size:14px; box-shadow:0 4px 18px rgba(0,0,0,.25);
    z-index:60; max-width:90vw; display:none}
  #toast.ok{background:#0f8a55} #toast.err{background:#b3283f}

  @media print{
    @page{ size:A4; margin:10mm }
    header.top, nav.tabs, .printopts, .side, #toast{ display:none !important }
    body{background:#fff}
    main{padding:0}
    .panel{border:none; padding:0; min-height:0; border-radius:0}
    .preview{background:#fff; padding:0}
    .plan{width:auto; min-height:0; box-shadow:none; margin:0; padding:0; page-break-after:always; display:block}
    .plan:last-child{page-break-after:auto}
    .p-foot{margin-top:14px}
  }
</style>
</head>

const fmtZeilen = t => fmt(t).replace(/\r?\n/g, "<br>");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const SCHLUESSEL = "mathe-wochenplan-pfs-v2";
let speicherOk = true;
function speichern(){
  try{ localStorage.setItem(SCHLUESSEL, JSON.stringify(state)); }
  catch(e){ speicherOk = false; }
  const el = document.getElementById("savestate");
  el.textContent = speicherOk ? "gespeichert ✓" : "NICHT gespeichert – Sicherung anlegen!";
  el.style.color = speicherOk ? "" : "#b3283f";
  clearTimeout(speichern._t);
  speichern._t = setTimeout(pubAnzeige, 400);
}
function geladen(){
  try{ const r = localStorage.getItem(SCHLUESSEL) || localStorage.getItem("mathe-wochenplan-pfs-v1");
       return r ? JSON.parse(r) : null; }
  catch(e){ return null; }
}

let state = geladen() || beispiel();
migriere();
function migriere(){
  const d = beispiel();
  if(!state.klassen || !state.klassen.length) state.klassen = d.klassen;
  for(const k of ["schule","lehrkraft"]) if(state[k] == null) state[k] = d[k];
  state.online = Object.assign({}, d.online, state.online || {});
  state.gh = Object.assign({}, d.gh, state.gh || {});
  state.druck = Object.assign({}, d.druck, state.druck || {});
  if(!Array.isArray(state.druck.klassenplaene)) state.druck.klassenplaene = ["alle"];
  (state.schueler || []).forEach(s => {
    if(!s.klasse || !state.klassen.some(k => k.id === s.klasse)) s.klasse = state.klassen[0].id;
    if(!JG.includes(s.jg)) s.jg = "4";
  });
  (state.wochen || []).forEach(w => {
    if(!w.bloecke && w.faecher) w.bloecke = w.faecher;                 // sehr alte Datei
    if(!w.bloecke) w.bloecke = [];
    if(!Array.isArray(w.fuer) || !w.fuer.length) w.fuer = state.klassen.map(k => k.id);
    w.bloecke.forEach(b => (b.aufgaben || []).forEach(a => {
      if(!Array.isArray(a.anhaenge)) a.anhaenge = [];
      if(a.art == null) a.art = a.typ === "Wahl" ? "Wahl" : "Pflicht";  // alte Datei
      delete a.typ;
      if(a.niveau == null) a.niveau = "";
    }));
    delete w.faecher; delete w.klassenstufe;
  });
  if(!state.aktiv || !state.wochen.some(w => w.id === state.aktiv)) state.aktiv = state.wochen[0]?.id || null;
}

let tab = "plan";
const woche = () => state.wochen.find(w => w.id === state.aktiv);
const key = (w,s) => w + "|" + s;
const klName = id => (state.klassen.find(k => k.id === id) || {}).name || "";
const wochenKlassen = w => w.fuer.map(klName).filter(Boolean).join(" & ");

/* =====================  Rendern  ===================== */
function setTab(t){ tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  render();
}
/* Kurzer Fingerabdruck des Plans – erkennt, ob es unveröffentlichte Änderungen gibt */
function signatur(){
  const t = VERSION + "|" + JSON.stringify(planDaten());
  let h = 5381;
  for(let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function pubAnzeige(){
  const el = document.getElementById("pubstate"), btn = document.getElementById("pubbtn");
  if(!el || !btn) return;
  const offen = state.gh.stand !== signatur();
  el.textContent = offen ? "Änderungen noch nicht veröffentlicht" : "online aktuell ✓";
  el.classList.toggle("offen", offen);
  btn.classList.toggle("offen", offen);
  btn.textContent = offen ? "Veröffentlichen •" : "Veröffentlichen";
}
function render(){
  speichern();
  const y = window.scrollY;
  const p = document.getElementById("panel");
  p.innerHTML = tab === "plan" ? viewPlan() : tab === "schueler" ? viewSchueler() : viewDruck();
  pubAnzeige();
  window.scrollTo(0, y);
}

        <input value="${esc(k.name)}" oninput="setKlasse('${k.id}',this.value)"></div>`).join("")}
      <div class="setting"><label class="f">Lehrkraft (optional)</label>
        <input value="${esc(state.lehrkraft)}" oninput="state.lehrkraft=this.value; speichern()"></div>
      <h3 style="margin-top:20px">Online-Seite</h3>
      <div class="setting"><label class="f">Adresse</label>
        <input value="${esc(state.online.url)}" placeholder="https://…"

      <div class="setting"><label class="f">QR-Bild (optional)</label>
        ${state.online.qr
          ? `<div class="row"><img src="${state.online.qr}" style="width:58px;height:58px;border:1px solid var(--line);border-radius:8px">
             <button class="mini" onclick="qrWeg()">entfernen</button></div>`

        <div class="row" style="margin-top:6px">
          <button class="mini" onclick="ghTest()">Verbindung testen</button>

function zeitraum(w){
  const d = s => { if(!s) return ""; const [y,m,t] = s.split("-"); return `${t}.${m}.${y.slice(2)}`; };
  if(w.von && w.bis) return d(w.von) + " – " + d(w.bis);
  return d(w.von) || d(w.bis) || "";
}
function sidebarWrap(inner){ return `<div class="cols">${sidebar()}<div>${inner}</div></div>`; }

/* ---------- 1 · Plan bearbeiten ---------- */
function viewPlan(){
  const w = woche();
  if(!w) return sidebarWrap('<div class="empty">Lege links eine neue Woche an.</div>');
  return sidebarWrap(`
    <div class="head-grid">
      <div><label class="f">Woche</label><input value="${esc(w.titel)}" placeholder="z. B. 3. Woche"
            oninput="setW('titel',this.value)"></div>
      <div><label class="f">von</label><input type="date" value="${esc(w.von)}" oninput="setW('von',this.value)"></div>
      <div><label class="f">bis</label><input type="date" value="${esc(w.bis)}" oninput="setW('bis',this.value)"></div>
    </div>
    <div class="gilt"><span class="muted small">Dieser Plan gilt für:</span>
      ${state.klassen.map(k => `<label><input type="checkbox" ${w.fuer.includes(k.id) ? "checked" : ""}
        onchange="toggleWochenKlasse('${k.id}')"> ${esc(k.name)}</label>`).join("")}
      <span class="muted small">· jahrgangsübergreifend 4–6</span>
    </div>
    <div style="margin-bottom:14px"><label class="f">Thema der Woche</label>
      <textarea rows="2" placeholder="z. B. Bruchrechnung – erweitern, kürzen, vergleichen"

    <div style="margin-bottom:20px"><label class="f">Hinweis für alle (optional) – Enter erzeugt eine neue Zeile</label>
      <textarea rows="4" oninput="setW('hinweis',this.value)"
        placeholder="z. B.&#10;Abgabe ist freitags.&#10;Bitte Name, Datum und Thema oben auf das Blatt schreiben.">${esc(w.hinweis)}</textarea></div>
    <label class="f">Aufgaben</label>
    <div class="hint" style="margin-bottom:12px"><b>Spalte „Art“:</b>
      <b>alle</b>, <b>Pflicht</b> und <b>Wahl</b> gelten für alle Kinder.
      <b>Klasse 4/5/6</b> erscheint nur auf den Plänen des jeweiligen Jahrgangs.<br>
      Das <b>Buch</b> steht auf dem Plan über den Aufgaben. Im Aufgabenfeld wird <b>jede Zeile
      zu einer eigenen Teilaufgabe</b> mit eigenem Kästchen zum Abhaken.<br>
      <b>Formatieren:</b> Text markieren und <b>Strg+B</b> (fett), <b>Strg+I</b> (kursiv) oder
      <b>Strg+U</b> (unterstrichen) drücken – geht in jedem Textfeld. Getippt sieht das so aus:

    ${w.bloecke.map((b,i) => blockHtml(b,i,w.bloecke.length)).join("")

    <button class="primary" onclick="neuerBlock()">+ Aufgabenblock hinzufügen</button>
    <span class="muted small" style="margin-left:10px">z. B. Pflichtaufgaben · Üben &amp; Trainieren · Wahlaufgaben</span>

function blockHtml(b, idx, n){
  const tasks = b.aufgaben.map((a,i) => `
    <div class="task">
      <select class="art" onchange="setA('${b.id}','${a.id}','art',this.value)"
              style="color:${artInfo(a.art).farbe}">
        ${ARTEN.map(x => `<option value="${x.wert}" ${a.art === x.wert ? "selected" : ""}>${x.wert}</option>`).join("")}
      </select>
      <select onchange="setA('${b.id}','${a.id}','niveau',this.value)" title="Niveaustufe">
        ${["","★","★★","★★★"].map(x => `<option value="${x}" ${a.niveau === x ? "selected" : ""}>${x || "ohne"}</option>`).join("")}
      </select>
      <textarea rows="3" placeholder="Eine Zeile je Teilaufgabe, z. B.&#10;Zahlen vergleichen und runden: S. 4, Nr. 3–5&#10;schriftliche Addition: S. 6, Nr. 11, 12, 15"
        oninput="setA('${b.id}','${a.id}','text',this.value)">${esc(a.text)}</textarea>
      <input placeholder="Buch, z. B. Matherad 4" value="${esc(a.material)}"
        oninput="setA('${b.id}','${a.id}','material',this.value)">
      <div class="acts">
        <button class="ghost mini" title="nach oben" onclick="moveA('${b.id}',${i},-1)">▲</button>
        <button class="ghost mini" title="nach unten" onclick="moveA('${b.id}',${i},1)">▼</button>
        <button class="ghost mini" title="löschen" onclick="delA('${b.id}','${a.id}')">✕</button>
      </div>
      <div class="anh">
        ${(a.anhaenge || []).map((h,hi) => `<span class="anhchip" title="${esc(h.url)}">
            <span>${h.art === "datei" ? "📄" : "🔗"} ${esc(h.titel)}</span>
            <button title="entfernen" onclick="delAnhang('${b.id}','${a.id}',${hi})">✕</button></span>`).join("")}
        <button class="mini" onclick="linkAnhaengen('${b.id}','${a.id}')">+ Link</button>
        <button class="mini" onclick="this.nextElementSibling.click()">+ Arbeitsblatt</button>
        <input type="file" style="display:none" onchange="dateiAnhaengen('${b.id}','${a.id}',this)">
      </div>
    </div>`).join("");
  return `<div class="block" style="--fc:${b.farbe}">
    <div class="block-head">
      <input type="color" class="swatch" value="${b.farbe}" title="Farbe"
             oninput="setB('${b.id}','farbe',this.value,this)">
      <input class="name" value="${esc(b.name)}" placeholder="Name des Blocks"
             oninput="setB('${b.id}','name',this.value)">
      <div class="grow"></div>
      <button class="ghost mini" onclick="moveB(${idx},-1)" ${idx === 0 ? "disabled" : ""}>▲</button>
      <button class="ghost mini" onclick="moveB(${idx},1)" ${idx === n-1 ? "disabled" : ""}>▼</button>
      <button class="ghost mini" onclick="delB('${b.id}')">Block löschen</button>
    </div>
    ${tasks || '<div class="empty small">noch keine Aufgabe</div>'}
    <button class="mini" onclick="neueAufgabe('${b.id}')">+ Aufgabe</button>
  </div>`;
}

/* ---------- 2 · Schüler & Bemerkungen ---------- */
function viewSchueler(){
  const w = woche();
  if(!w) return sidebarWrap('<div class="empty">Lege zuerst eine Woche an.</div>');
  const alle = [];
  w.bloecke.forEach(b => b.aufgaben.forEach(a => alle.push({ b, a })));
  const gruppen = state.klassen.map(k => {
    const kinder = state.schueler.filter(s => s.klasse === k.id);
    const gilt = w.fuer.includes(k.id);
    const body = kinder.map(s => studHtml(s, w, alle)).join("")
      || '<div class="empty">Noch keine Kinder in dieser Klasse.</div>';
    return `<div class="klhead"><h2>${esc(k.name)}</h2>
        <span class="muted small">${kinder.length} Kinder${gilt ? "" : " · dieser Wochenplan gilt nicht für diese Klasse"}</span></div>
      ${body}`;
  }).join("");
  return sidebarWrap(`
    <div class="hint">Jedes Kind bekommt automatisch nur die Aufgaben seines Jahrgangs
      (plus alle Pflicht- und Wahlaufgaben). Zusätzlich kannst du hier einzelne Aufgaben abwählen
      und eine persönliche Bemerkung ergänzen.</div>
    <div class="row" style="margin-bottom:6px">
      <input id="neuname" placeholder="Name eingeben und Enter drücken"
        onkeydown="if(event.key==='Enter')neuerSchueler()">
      <select id="neuklasse" style="width:auto">
        ${state.klassen.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join("")}
      </select>
      <select id="neujg" style="width:auto">${JG.map(j => `<option value="${j}">Klasse ${j}</option>`).join("")}</select>
      <button onclick="neuerSchueler()">+ Schüler</button>
      <button onclick="mehrereSchueler()">Liste einfügen</button>
    </div>
    ${gruppen}`);
}
function studHtml(s, w, alle){
  const k = key(w.id, s.id);
  const aus = state.aus[k] || [];
  const chips = alle.map(({b,a}) => {
    const fremd = !giltFuer(a, s.jg);
    return `<span class="chip ${fremd ? "fremd" : aus.includes(a.id) ? "off" : ""}" style="--fc:${b.farbe}"
        title="${esc(b.name)}: ${esc(a.text)}${fremd ? " (anderer Jahrgang)" : ""}"
        ${fremd ? "" : `onclick="toggleAufgabe('${s.id}','${a.id}')"`}>
        <i></i>${esc(kurz(a.text))}${a.niveau ? " " + a.niveau : ""}</span>`;
  }).join("");
  return `<div class="stud">
    <div class="stud-head">
      <input class="nm" value="${esc(s.name)}" oninput="setS('${s.id}','name',this.value)">
      <select onchange="setS('${s.id}','klasse',this.value)">
        ${state.klassen.map(x => `<option value="${x.id}" ${s.klasse === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
      </select>
      <select onchange="setS('${s.id}','jg',this.value)">
        ${JG.map(j => `<option value="${j}" ${s.jg === j ? "selected" : ""}>Klasse ${j}</option>`).join("")}
      </select>
      <div class="grow"></div>
      <button class="ghost mini" onclick="druckeEinzeln('${s.id}')">nur diesen Plan drucken</button>
      <button class="ghost mini" onclick="delS('${s.id}')">✕</button>
    </div>
    <label class="f">Persönliche Bemerkung für ${esc(w.titel)}</label>
    <textarea placeholder="z. B. Bitte erst die ★-Aufgaben, dann Nr. 9."
      oninput="setBem('${s.id}',this.value)">${esc(state.bemerkungen[k] || "")}</textarea>
    <label class="f" style="margin-top:10px">Aufgaben – zum Weglassen anklicken (blass = anderer Jahrgang)</label>
    <div class="taskpick">${chips || '<span class="muted small">keine Aufgaben in dieser Woche</span>'}</div>
  </div>`;
}
function kurz(t){ t = ohneZeichen(teilaufgaben(t)[0] || "").trim(); return t.length > 32 ? t.slice(0,30) + "…" : (t || "Aufgabe"); }

/* ---------- 3 · Vorschau & Druck ---------- */
function viewDruck(){
  const w = woche(); const d = state.druck;
  if(!w) return '<div class="empty">Lege zuerst eine Woche an.</div>';
  const cb = (feld, txt) => `<label class="cb"><input type="checkbox" ${d[feld] ? "checked" : ""}
      onchange="state.druck.${feld}=this.checked; render()"> ${txt}</label>`;
  const kp = [["alle","alle Jahrgänge"],["4","nur Klasse 4"],["5","nur Klasse 5"],["6","nur Klasse 6"]]
    .map(([v,t]) => `<label class="cb"><input type="checkbox" ${d.klassenplaene.includes(v) ? "checked" : ""}
        onchange="toggleKlassenplan('${v}')"> ${t}</label>`).join("");
  const kinder = state.klassen.filter(k => w.fuer.includes(k.id)).map(k => {
    const list = state.schueler.filter(s => s.klasse === k.id).map(s => `
      <label class="cb"><input type="checkbox" ${d.gewaehlt.includes(s.id) ? "checked" : ""}
        onchange="toggleDruckSchueler('${s.id}')"> ${esc(s.name)} <span class="muted small">(Kl. ${s.jg})</span></label>`).join("");
    return list ? `<b class="small">${esc(k.name)}:</b> ${list}
      <button class="mini" onclick="alleSchuelerDruck(true,'${k.id}')">alle</button>` : "";
  }).join(" ");
  return `
    <div class="printopts">
      <b class="small">Klassenplan (ohne Namen):</b> ${kp}
      <button class="primary" onclick="window.print()">Drucken / als PDF speichern</button>
    </div>
    <div class="printopts">
      <b class="small">Einzelpläne:</b>
      ${kinder || '<span class="muted small">keine Schüler angelegt</span>'}
      <button class="mini" onclick="alleSchuelerDruck(false)">keine</button>
    </div>
    <div class="printopts">
      ${cb("kaestchen","Kästchen zum Abhaken")}
      ${cb("selbst","Selbsteinschätzung")}
      ${cb("niveau","Niveau-Sterne")}
      ${cb("bemerkungsfeld","Bemerkungsfeld")}
      ${cb("unterschrift","Unterschriftszeilen")}
      ${cb("logo","Schullogo")}
      ${cb("onlineinfo","Online-Adresse / QR")}
    </div>
    <div class="preview">${planSeiten()}</div>`;
}
function planSeiten(){
  const w = woche(); const d = state.druck; const seiten = [];
  ["alle","4","5","6"].filter(v => d.klassenplaene.includes(v))
    .forEach(v => seiten.push(planHtml(w, null, v === "alle" ? null : v)));
  state.schueler.filter(s => d.gewaehlt.includes(s.id)).forEach(s => seiten.push(planHtml(w, s, s.jg)));
  return seiten.join("") ||
    '<div class="empty" style="text-align:center">Nichts ausgewählt – oben Klassenplan oder Schüler anhaken.</div>';
}
function anhangDruck(a){
  const h = a.anhaenge || [];
  if(!h.length) return "";
  return `<div class="p-anh">${h.map(x =>
    (x.art === "datei" ? "▸ Arbeitsblatt: " : "▸ Link: ") + "<b>" + esc(x.titel) + "</b>").join(" &nbsp; ")}
    <span style="color:#7b8494"> – online auf der Wochenplan-Seite</span></div>`;
}
function planHtml(w, s, jg){
  const d = state.druck;
  const aus = s ? (state.aus[key(w.id, s.id)] || []) : [];
  const bem = s ? (state.bemerkungen[key(w.id, s.id)] || "") : "";
  let bi = 0;
  const bloecke = w.bloecke.map(b => {
    const auf = b.aufgaben.filter(a => giltFuer(a, jg) && !aus.includes(a.id));
    if(!auf.length) return "";
    const zeilen = auf.map(a => {
      const i = artInfo(a.art);
      const vorn = i.badge && a.art !== "Wahl" && !(jg && i.jg)
        ? `<span class="p-art" style="background:${i.farbe}">${i.kurz}</span>` : "";
      const hinten = a.art === "Wahl"
        ? `<span class="p-art hinten" style="background:${i.farbe}">Wahl</span>` : "";
      const niv  = d.niveau && a.niveau ? `<span class="p-niv">${a.niveau}</span>` : "";
      const self = d.selbst ? '<span class="p-self"><span></span><span></span><span></span></span>' : "";
      const box  = d.kaestchen ? '<span class="p-box"></span>' : "";
      const teile = teilaufgaben(a.text);
      if(!a.material && teile.length < 2)                       // kurze Aufgabe: alles in einer Zeile
        return `<div class="p-task"><div class="p-zeile">${box}<span class="p-txt">${vorn}${
          fmt(teile[0] || "")}${niv}${hinten}</span>${self}</div>${anhangDruck(a)}</div>`;
      const kopfInhalt = vorn + niv + hinten;                   // Zeile 1: Klasse / Wahl / Niveau
      const kopfZeile = kopfInhalt ? `<div class="p-kopf">${kopfInhalt}${self}</div>` : "";
      const buchZeile = a.material                              // Zeile 2: das Buch
        ? `<div class="p-buch">${fmt(a.material)}${kopfInhalt ? "" : self}</div>`
        : (kopfInhalt ? "" : `<div class="p-kopf">${self}</div>`);
      return `<div class="p-task">${kopfZeile}${buchZeile}
        ${teile.map(t => `<div class="p-zeile">${box}<span class="p-txt">${fmt(t)}</span></div>`).join("")}
        ${anhangDruck(a)}
      </div>`;
    }).join("");
    const anzahl = x => Math.max(1, teilaufgaben(x.text).length);   // Teilaufgaben zählen
    const gesamt = auf.reduce((n,x) => n + anzahl(x), 0);
    const wahl = auf.filter(x => x.art === "Wahl").reduce((n,x) => n + anzahl(x), 0);
    const kopf = bi++ === 0 && d.selbst ? '<div class="p-selfhead">gut · geht so · Hilfe</div>' : "";
    return `<div class="p-block" style="--fc:${b.farbe}">
      <h2>${fmt(b.name)}<span class="anz">${gesamt - wahl} Pflicht · ${wahl} Wahl</span></h2>
      ${kopf}${zeilen}</div>`;
  }).join("");
  const jgText = jg ? "Jahrgang " + jg : "Jahrgang 4–6";
  return `<div class="plan">
    <div class="p-top">
      ${d.logo ? `<img src="${LOGO}" alt="">` : `<div><b>${esc(state.schule)}</b></div>`}
      <div class="p-title">
        <h1>Wochenplan</h1><div class="fach">Mathematik</div>
        <div class="kl">${esc(s ? klName(s.klasse) : wochenKlassen(w))} · ${jgText}${
          state.lehrkraft ? " · " + esc(state.lehrkraft) : ""}</div>
      </div>
    </div>
    <div class="p-name"><span class="nm">${s ? esc(s.name) : "Name:"}</span>${s ? "" : '<span class="nmline"></span>'}</div>
    <div class="p-meta">
      <div><b>Woche:</b> ${esc(w.titel)}</div>
      ${zeitraum(w) ? `<div><b>Zeitraum:</b> ${esc(zeitraum(w))}</div>` : ""}
    </div>
    ${w.thema ? `<p class="p-thema">Thema: ${fmtZeilen(w.thema)}</p>` : ""}
    ${w.hinweis ? `<div class="p-note"><h3>Hinweis</h3>${fmtZeilen(w.hinweis)}</div>` : ""}
    ${bloecke || '<div class="empty">keine Aufgaben</div>'}
    ${d.bemerkungsfeld ? `<div class="p-note"><h3>Bemerkungen</h3>${fmtZeilen(bem)}
      <div class="p-lines">${"<div></div>".repeat(bem ? 1 : 2)}</div></div>` : ""}
    <div class="p-foot">
      ${d.onlineinfo && (state.online.url || state.online.qr) ? `<div class="p-online">
        ${state.online.qr ? `<img src="${state.online.qr}" alt="">` : ""}
        <div class="t"><b>Wochenplan online zum Abhaken</b>
          ${esc(state.online.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</div></div>` : ""}
      ${d.selbst ? '<div class="p-legend">Selbsteinschätzung:<b></b> gut geklappt<b></b> ging so<b></b> brauche noch Hilfe</div>' : ""}
      ${d.unterschrift ? `<div class="p-sign"><div>Datum, Unterschrift Schüler/in</div>
        <div>Datum, Unterschrift Eltern</div><div>Bemerkung Lehrkraft</div></div>` : ""}
    </div>
  </div>`;
}

function download(name, inhalt, typ){
  const b = new Blob([inhalt], { type: typ }), a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function heute(){ return new Date().toISOString().slice(0,10); }

}
function laden(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {

      state = neu; migriere(); setTab("plan");

/* ---------- Veröffentlichen: schreibt direkt in dein GitHub-Repository ---------- */
function toast(text, art){
  const t = document.getElementById("toast");
  t.textContent = text; t.className = art || ""; t.style.display = "block";
  clearTimeout(toast._t);
  if(art) toast._t = setTimeout(() => { t.style.display = "none"; }, 7000);
}
function b64Bytes(bytes){
  let bin = "";
  for(let i = 0; i < bytes.length; i += 8192)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}
function b64(text){ return b64Bytes(new TextEncoder().encode(text)); }
function ghKopf(){
  return { "Authorization": "Bearer " + state.gh.token,
           "Accept": "application/vnd.github+json",
           "X-GitHub-Api-Version": "2022-11-28" };
}
function ghFehler(status){
  if(status === 401) return "Der Zugangsschlüssel wird nicht akzeptiert (abgelaufen oder falsch kopiert).";
  if(status === 403) return "Keine Berechtigung – der Schlüssel braucht für dieses Repository das Recht „Contents: Read and write“.";
  if(status === 404) return "Repository nicht gefunden – prüfe die Schreibweise benutzer/repository.";
  if(status === 409) return "Zeitgleiche Änderung – bitte noch einmal auf Veröffentlichen klicken.";
  if(status === 422) return "GitHub hat die Datei abgelehnt (422).";
  return "GitHub meldet Fehler " + status + ".";
}
async function ghPut(pfad, inhalt, nachricht){ return ghPutRoh(pfad, b64(inhalt), nachricht); }
async function ghPutRoh(pfad, inhaltB64, nachricht){
  const url = "https://api.github.com/repos/" + state.gh.repo + "/contents/" +
              pfad.split("/").map(encodeURIComponent).join("/");
  let sha;
  const alt = await fetch(url + "?ref=" + encodeURIComponent(state.gh.branch), { headers: ghKopf() });
  if(alt.status === 200) sha = (await alt.json()).sha;
  else if(alt.status !== 404) throw new Error(ghFehler(alt.status));
  const res = await fetch(url, { method:"PUT",
    headers: Object.assign({ "Content-Type":"application/json" }, ghKopf()),
    body: JSON.stringify(Object.assign({ message: nachricht, content: inhaltB64,
      branch: state.gh.branch }, sha ? { sha } : {})) });
  if(!res.ok) throw new Error(ghFehler(res.status));
}
async function ghTest(){
  if(!state.gh.repo || !state.gh.token) return toast("Bitte zuerst Repository und Zugangsschlüssel eintragen.", "err");
  toast("Prüfe Verbindung …");
  try{
    const r = await fetch("https://api.github.com/repos/" + state.gh.repo, { headers: ghKopf() });
    if(!r.ok) throw new Error(ghFehler(r.status));
    toast("Verbindung steht – du kannst veröffentlichen.", "ok");
  }catch(e){ toast(e.message || "Keine Verbindung zu GitHub.", "err"); }
}

async function onlineLaden(){
  if(!state.gh.repo) return toast("Trage links unter „Online-Seite“ zuerst das Repository ein.", "err");
  if(!confirm("Der zuletzt veröffentlichte Stand wird geladen und ersetzt die Wochenpläne in diesem Browser.\n\n" +
              "Schülerlisten und Bemerkungen bleiben erhalten.\n\nFortfahren?")) return;
  toast("Hole den Online-Stand …");
  try{
    const url = "https://raw.githubusercontent.com/" + state.gh.repo + "/" + state.gh.branch +
                "/wochenplaene-daten.json?t=" + Date.now();
    const r = await fetch(url, { cache:"no-store" });
    if(r.status === 404) throw new Error("Online liegt noch keine Datenkopie – veröffentliche zuerst einmal.");
    if(!r.ok) throw new Error("Der Online-Stand ließ sich nicht laden (Fehler " + r.status + ").");
    const d = await r.json();
    if(!Array.isArray(d.wochen)) throw new Error("Die Online-Datei hat ein unerwartetes Format.");
    if(d.schule) state.schule = d.schule;
    if(Array.isArray(d.klassen) && d.klassen.length) state.klassen = d.klassen;
    state.wochen = d.wochen;
    state.aktiv = null; migriere(); setTab("plan");
    toast("Online-Stand geladen – " + state.wochen.length + " Woche(n).", "ok");
  }catch(e){ toast(e.message || "Laden fehlgeschlagen.", "err"); }
}

    state.gh.stand = signatur();
    speichern(); pubAnzeige();
    toast("Veröffentlicht ✓ – in etwa einer Minute ist die neue Fassung online.", "ok");
  }catch(e){ toast(e.message || "Veröffentlichen fehlgeschlagen.", "err"); }
}
/* ---------- Strg+B / Strg+I / Strg+U in jedem Textfeld ---------- */
document.addEventListener("keydown", e => {
  if(!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const zeichen = { b:"*", i:"_", u:"__" }[String(e.key).toLowerCase()];
  if(!zeichen) return;
  const el = document.activeElement;
  if(!el || (el.tagName !== "TEXTAREA" && !(el.tagName === "INPUT" && (!el.type || el.type === "text")))) return;
  e.preventDefault();
  umschliessen(el, zeichen);
});
function umschliessen(el, z){
  const a = el.selectionStart, b = el.selectionEnd, v = el.value;
  if(a === b){ toast("Markiere erst den Text, der ausgezeichnet werden soll.", "err"); return; }
  const innen = v.slice(a, b);
  let neu, von, bis;
  if(v.slice(a - z.length, a) === z && v.slice(b, b + z.length) === z){      // schon ausgezeichnet → entfernen
    neu = v.slice(0, a - z.length) + innen + v.slice(b + z.length);
    von = a - z.length; bis = b - z.length;
  }else{
    neu = v.slice(0, a) + z + innen + z + v.slice(b);
    von = a + z.length; bis = b + z.length;
  }
  el.value = neu;
  el.setSelectionRange(von, bis);
  el.dispatchEvent(new Event("input", { bubbles: true }));
  el.focus();
}
</script>

<body>
<header><img id="logo" alt=""><div class="t"><h1>Wochenpläne Mathematik</h1><p id="schule"></p></div></header>
<div class="wrap">
  <div class="filter">
    <div class="lab">Meine Klasse</div><div class="pills" id="pk"></div>
    <div class="lab" style="margin-top:10px">Mein Jahrgang</div><div class="pills" id="pj"></div>
    <div class="legende" id="legende"></div>
  </div>
  <div class="picker" id="picker"></div><div id="inhalt"></div>
  <footer>Die Häkchen bleiben nur auf deinem eigenen Gerät – sie werden nicht übertragen.
  <span style="opacity:.6">· Version __VERSION__</span></footer>
</div>
<script>
const DATEN = /*DATEN*/null;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const teilaufgaben = t => String(t==null?"":t).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
function fmt(t){ return esc(t)
  .replace(/__([^_\n]+)__/g,"<u>$1<\/u>")
  .replace(/\*([^*\n]+)\*/g,"<b>$1<\/b>")
  .replace(/_([^_\n]+)_/g,"<i>$1<\/i>"); }
const fmtZeilen = t => fmt(t).replace(/\r?\n/g,"<br>");
const ARTFARBE = { "alle":"#5b6472", "Wahl":"#b8791a", "Klasse 4":"#0e7490", "Klasse 5":"#7c3aed", "Klasse 6":"#b3283f" };
const ARTKURZ  = { "alle":"alle", "Wahl":"Wahl", "Klasse 4":"Klasse 4", "Klasse 5":"Klasse 5", "Klasse 6":"Klasse 6" };
const LEGENDE =
  '<b>So liest du den Plan:<\/b>' +
  '<div class="z"><span class="sw" style="background:#0e7490"><\/span>' +
  '<span>Farbig markierte Aufgaben sind <b>nur f\u00fcr die genannte Klassenstufe<\/b> ' +
  '(Klasse 4 t\u00fcrkis, Klasse 5 lila, Klasse 6 rot).<\/span><\/div>' +
  '<div class="z"><span class="sw" style="background:#5b6472"><\/span>' +
  '<span>Aufgaben mit <b>alle<\/b> oder ganz ohne Markierung sind <b>f\u00fcr alle Kinder<\/b>.<\/span><\/div>' +
  '<div class="z"><span class="sw" style="background:#b8791a"><\/span>' +
  '<span><b>Wahl<\/b> hei\u00dft: Du darfst dir aussuchen, ob du sie machst.<\/span><\/div>';
let hak = {}, pref = { kl:"", jg:"" }, i = 0;
try{ hak = JSON.parse(localStorage.getItem("mathe-wp-haken")||"{}"); }catch(e){}
try{ pref = Object.assign(pref, JSON.parse(localStorage.getItem("mathe-wp-pref")||"{}")); }catch(e){}
function merken(){ try{ localStorage.setItem("mathe-wp-pref", JSON.stringify(pref)); }catch(e){} }
if(DATEN.logo) document.getElementById("logo").src = DATEN.logo; else document.getElementById("logo").remove();
document.getElementById("schule").textContent = DATEN.schule || "";
function zeitraum(w){const d=s=>{if(!s)return "";const p=s.split("-");return p[2]+"."+p[1]+"."+p[0].slice(2)};
  return w.von&&w.bis ? d(w.von)+" – "+d(w.bis) : (d(w.von)||d(w.bis)||"")}
function toggle(id){ hak[id]=!hak[id]; try{localStorage.setItem("mathe-wp-haken",JSON.stringify(hak))}catch(e){} zeige(); }
function setKl(v){ pref.kl = v; i = 0; merken(); zeige(); }
function setJg(v){ pref.jg = v; merken(); zeige(); }
function gilt(a){ const m = /^Klasse ([456])$/.exec(a.art||""); return !m || !pref.jg || m[1] === pref.jg; }
function zeige(){
  document.getElementById("pk").innerHTML =
    ('<button class="'+(pref.kl?"":"active")+'" onclick="setKl(\'\')">alle Klassen<\/button>' +
     DATEN.klassen.map(k=>'<button class="'+(pref.kl===k.id?"active":"")+'" onclick="setKl(\''+k.id+'\')">'+esc(k.name)+'<\/button>').join(""));
  document.getElementById("pj").innerHTML =
    ('<button class="'+(pref.jg?"":"active")+'" onclick="setJg(\'\')">alles anzeigen<\/button>' +
     ["4","5","6"].map(j=>'<button class="'+(pref.jg===j?"active":"")+'" onclick="setJg(\''+j+'\')">Klasse '+j+'<\/button>').join(""));
  document.getElementById("legende").innerHTML = pref.jg ? "" : LEGENDE;
  document.getElementById("legende").style.display = pref.jg ? "none" : "";
  const wochen = DATEN.wochen.filter(w => !pref.kl || !w.fuer || w.fuer.indexOf(pref.kl) >= 0);
  if(i >= wochen.length) i = 0;
  document.getElementById("picker").innerHTML = wochen.map((w,n)=>
    '<button class="'+(n===i?"active":"")+'" onclick="i='+n+';zeige()">'+esc(w.titel)+'<\/button>').join("");
  const w = wochen[i];
  if(!w){ document.getElementById("inhalt").innerHTML = '<div class="card">Für diese Auswahl gibt es noch keinen Plan.<\/div>'; return; }
  let ges = 0, fertig = 0;
  const bloecke = w.bloecke.map(b=>{
    const auf = b.aufgaben.filter(gilt);
    if(!auf.length) return "";
    const zeilen = auf.map(a=>{
      const m = /^Klasse ([456])$/.exec(a.art||"");
      const vorn = (m || a.art==="alle")
        ? '<span class="tag" style="background:'+ARTFARBE[a.art]+'">'+ARTKURZ[a.art]+'<\/span>' : "";
      const hinten = a.art==="Wahl" ? '<span class="tag hinten" style="background:'+ARTFARBE[a.art]+'">Wahl<\/span>' : "";
      const niv = a.niveau ? '<span class="niv">'+a.niveau+'<\/span>' : "";
      const teile = teilaufgaben(a.text);
      const ids = teile.map((t,n)=> n ? a.id+"#"+n : a.id);   // erste Zeile behält ihre Kennung
      ids.forEach(id=>{ ges++; if(hak[id]) fertig++; });
      const mitKopf = !!a.material || teile.length > 1;
      const kopfInhalt = vorn + niv + hinten;
      const alleFertig = ids.length > 0 && ids.every(id=>hak[id]);
      let html = '<div class="auf'+(m?" jg jg"+m[1]:"")+'">';
      if(mitKopf){
        if(kopfInhalt) html += '<div class="kopf'+(alleFertig?" done":"")+'">'+kopfInhalt+'<\/div>';
        if(a.material) html += '<div class="buch'+(alleFertig?" done":"")+'">'+fmt(a.material)+'<\/div>';
      }
      teile.forEach((t,n)=>{
        const id = ids[n];
        html += '<div class="zeile"><span class="bx'+(hak[id]?" on":"")+
          '" onclick="toggle(\''+id+'\')"><\/span><span class="'+(hak[id]?"done":"")+'">'+
          (mitKopf?"":vorn)+fmt(t)+(mitKopf?"":niv+hinten)+'<\/span><\/div>';
      });
      const anh = (a.anhaenge||[]).map(x=>
        '<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+
        (x.art==="datei"?"📄":"🔗")+' '+esc(x.titel)+'<\/a>').join("");
      if(anh) html += '<div class="anhaenge">'+anh+'<\/div>';
      return html + '<\/div>';
    }).join("");
    return '<div class="blk" style="border-left-color:'+b.farbe+'"><h3>'+fmt(b.name)+'<\/h3>'+zeilen+'<\/div>';
  }).join("");
  const klNamen = (w.fuer||[]).map(id=>(DATEN.klassen.find(k=>k.id===id)||{}).name).filter(Boolean).join(" & ");
  document.getElementById("inhalt").innerHTML =
    '<div class="card"><div class="meta"><span><b>'+esc(w.titel)+'<\/b><\/span>'+
    (zeitraum(w)?'<span>'+esc(zeitraum(w))+'<\/span>':'')+
    (klNamen?'<span>'+esc(klNamen)+'<\/span>':'')+
    (pref.jg?'<span>Klasse '+pref.jg+'<\/span>':'<span>Jahrgang 4–6<\/span>')+'<\/div>'+
    (w.thema?'<h2 class="thema">'+fmtZeilen(w.thema)+'<\/h2>':'')+
    (w.hinweis?'<div class="hinw">'+fmtZeilen(w.hinweis)+'<\/div>':'')+
    bloecke+'<div class="fortschritt">'+fertig+' von '+ges+' Aufgaben erledigt<\/div><\/div>';
}
zeige();
<\/script>

</script>
