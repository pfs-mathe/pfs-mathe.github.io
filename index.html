<style>
:root{--ink:#15202b;--muted:#657085;--line:#e2e7f0;--accent:#1f4e9c}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:#eef2f8;color:var(--ink);line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:46px;width:auto}
header .t{border-left:1px solid var(--line);padding-left:16px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 60px}
.filter{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.filter .lab{font-size:13px;color:var(--muted);margin-bottom:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-weight:600;color:var(--muted)}
.pills button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.picker button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--muted)}
.picker button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(20,40,80,.07)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.meta span{background:#f1f4fa;border-radius:8px;padding:4px 11px;font-size:14px}
h2.thema{margin:0 0 6px;font-size:20px}
.hinw{background:#fff8e6;border:1px solid #f3dda3;color:#7a5a12;border-radius:10px;padding:10px 12px;margin:12px 0}
.blk{border:1px solid var(--line);border-left:7px solid #888;border-radius:12px;padding:12px 14px;margin:12px 0}
.blk h3{margin:0 0 6px;font-size:17px}
.auf{display:block;padding:8px 0;border-top:1px dotted var(--line)}
.auf:first-of-type{border-top:none}
.auf.jg{border-top:none;border-left:5px solid var(--jc);border-radius:8px;padding:9px 11px;margin:6px 0}
.kopf{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.buch{font-weight:700;font-size:16.5px;margin:0 0 4px}
.kopf.done,.buch.done{opacity:.45}
.zeile{display:flex;gap:11px;align-items:flex-start;padding:5px 0 5px 2px}
.anhaenge{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px 29px}
.anhaenge a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:#eef3fb;
  border:1px solid #cfdcf1;color:#1f4e9c;border-radius:10px;padding:7px 13px;font-size:14.5px;font-weight:600}
.anhaenge a:hover{background:#dfe9f8}
.auf.jg4{--jc:#0e7490;background:rgba(14,116,144,.07)}
.auf.jg5{--jc:#7c3aed;background:rgba(124,58,237,.07)}
.auf.jg6{--jc:#b3283f;background:rgba(179,40,63,.07)}
.legende{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:#40495a}
.legende .z{display:flex;gap:8px;align-items:center;margin-top:6px}
.legende .sw{width:15px;height:15px;border-radius:4px;flex:0 0 auto}
.bx{flex:0 0 auto;width:18px;height:18px;border:2px solid #9aa4b6;border-radius:4px;margin-top:2px;cursor:pointer}
.bx.on{background:var(--accent);border-color:var(--accent);position:relative}
.bx.on:after{content:"✓";color:#fff;position:absolute;left:2px;top:-4px;font-size:15px}
.done{text-decoration:line-through;color:var(--muted)}
.mat{display:block;font-size:13px;color:var(--muted)}
.niv{color:var(--accent);letter-spacing:1px;margin-left:5px;font-size:13px}
.tag{font-size:12px;font-weight:700;letter-spacing:.02em;background:#8a93a3;color:#fff;border-radius:6px;padding:1px 8px;margin-right:7px;white-space:nowrap}
.tag.hinten{margin-right:0;margin-left:7px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.fortschritt{font-size:13px;color:var(--muted);margin-top:14px;text-align:right}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
@media print{.picker,.filter,footer,.bx{display:none}body{background:#fff}.card{box-shadow:none}}

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const teilaufgaben = t => String(t==null?"":t).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const ARTFARBE = { "alle":"#5b6472", "Wahl":"#b8791a", "Klasse 4":"#0e7490", "Klasse 5":"#7c3aed", "Klasse 6":"#b3283f" };
const ARTKURZ  = { "alle":"alle", "Wahl":"Wahl", "Klasse 4":"Klasse 4", "Klasse 5":"Klasse 5", "Klasse 6":"Klasse 6" };
const LEGENDE =
  '<b>So liest du den Plan:</b>' +
  '<div class="z"><span class="sw" style="background:#0e7490"></span>' +
  '<span>Farbig markierte Aufgaben sind <b>nur f\u00fcr die genannte Klassenstufe</b> ' +
  '(Klasse 4 t\u00fcrkis, Klasse 5 lila, Klasse 6 rot).</span></div>' +
  '<div class="z"><span class="sw" style="background:#5b6472"></span>' +
  '<span>Aufgaben mit <b>alle</b> oder ganz ohne Markierung sind <b>f\u00fcr alle Kinder</b>.</span></div>' +
  '<div class="z"><span class="sw" style="background:#b8791a"></span>' +
  '<span><b>Wahl</b> hei\u00dft: Du darfst dir aussuchen, ob du sie machst.</span></div>';
let hak = {}, pref = { kl:"", jg:"" }, i = 0;
try{ hak = JSON.parse(localStorage.getItem("mathe-wp-haken")||"{}"); }catch(e){}
try{ pref = Object.assign(pref, JSON.parse(localStorage.getItem("mathe-wp-pref")||"{}")); }catch(e){}
function merken(){ try{ localStorage.setItem("mathe-wp-pref", JSON.stringify(pref)); }catch(e){} }
if(DATEN.logo) document.getElementById("logo").src = DATEN.logo; else document.getElementById("logo").remove();
document.getElementById("schule").textContent = DATEN.schule || "";
function zeitraum(w){const d=s=>{if(!s)return "";const p=s.split("-");return p[2]+"."+p[1]+"."+p[0].slice(2)};
  return w.von&&w.bis ? d(w.von)+" – "+d(w.bis) : (d(w.von)||d(w.bis)||"")}
function toggle(id){ hak[id]=!hak[id]; try{localStorage.setItem("mathe-wp-haken",JSON.stringify(hak))}catch(e){} zeige(); }
function setKl(v){ pref.kl = v; i = 0; merken(); zeige(); }
function setJg(v){ pref.jg = v; merken(); zeige(); }
function gilt(a){ const m = /^Klasse ([456])$/.exec(a.art||""); return !m || !pref.jg || m[1] === pref.jg; }
function zeige(){
  document.getElementById("pk").innerHTML =
    ('<button class="'+(pref.kl?"":"active")+'" onclick="setKl(\'\')">alle Klassen</button>' +
     DATEN.klassen.map(k=>'<button class="'+(pref.kl===k.id?"active":"")+'" onclick="setKl(\''+k.id+'\')">'+esc(k.name)+'</button>').join(""));
  document.getElementById("pj").innerHTML =
    ('<button class="'+(pref.jg?"":"active")+'" onclick="setJg(\'\')">alles anzeigen</button>' +
     ["4","5","6"].map(j=>'<button class="'+(pref.jg===j?"active":"")+'" onclick="setJg(\''+j+'\')">Klasse '+j+'</button>').join(""));
  document.getElementById("legende").innerHTML = pref.jg ? "" : LEGENDE;
  document.getElementById("legende").style.display = pref.jg ? "none" : "";
  const wochen = DATEN.wochen.filter(w => !pref.kl || !w.fuer || w.fuer.indexOf(pref.kl) >= 0);
  if(i >= wochen.length) i = 0;
  document.getElementById("picker").innerHTML = wochen.map((w,n)=>
    '<button class="'+(n===i?"active":"")+'" onclick="i='+n+';zeige()">'+esc(w.titel)+'</button>').join("");
  const w = wochen[i];
  if(!w){ document.getElementById("inhalt").innerHTML = '<div class="card">Für diese Auswahl gibt es noch keinen Plan.</div>'; return; }
  let ges = 0, fertig = 0;
  const bloecke = w.bloecke.map(b=>{
    const auf = b.aufgaben.filter(gilt);
    if(!auf.length) return "";
    const zeilen = auf.map(a=>{
      const m = /^Klasse ([456])$/.exec(a.art||"");
      const vorn = (m || a.art==="alle")
        ? '<span class="tag" style="background:'+ARTFARBE[a.art]+'">'+ARTKURZ[a.art]+'</span>' : "";
      const hinten = a.art==="Wahl" ? '<span class="tag hinten" style="background:'+ARTFARBE[a.art]+'">Wahl</span>' : "";
      const niv = a.niveau ? '<span class="niv">'+a.niveau+'</span>' : "";
      const teile = teilaufgaben(a.text);
      const ids = teile.map((t,n)=> n ? a.id+"#"+n : a.id);   // erste Zeile behält ihre Kennung
      ids.forEach(id=>{ ges++; if(hak[id]) fertig++; });
      const mitKopf = !!a.material || teile.length > 1;
      const kopfInhalt = vorn + niv + hinten;
      const alleFertig = ids.length > 0 && ids.every(id=>hak[id]);
      let html = '<div class="auf'+(m?" jg jg"+m[1]:"")+'">';
      if(mitKopf){
        if(kopfInhalt) html += '<div class="kopf'+(alleFertig?" done":"")+'">'+kopfInhalt+'</div>';
        if(a.material) html += '<div class="buch'+(alleFertig?" done":"")+'">'+esc(a.material)+'</div>';
      }
      teile.forEach((t,n)=>{
        const id = ids[n];
        html += '<div class="zeile"><span class="bx'+(hak[id]?" on":"")+
          '" onclick="toggle(\''+id+'\')"></span><span class="'+(hak[id]?"done":"")+'">'+
          (mitKopf?"":vorn)+esc(t)+(mitKopf?"":niv+hinten)+'</span></div>';
      });
      const anh = (a.anhaenge||[]).map(x=>
        '<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+
        (x.art==="datei"?"📄":"🔗")+' '+esc(x.titel)+'</a>').join("");
      if(anh) html += '<div class="anhaenge">'+anh+'</div>';
      return html + '</div>';
    }).join("");
    return '<div class="blk" style="border-left-color:'+b.farbe+'"><h3>'+esc(b.name)+'</h3>'+zeilen+'</div>';
  }).join("");
  const klNamen = (w.fuer||[]).map(id=>(DATEN.klassen.find(k=>k.id===id)||{}).name).filter(Boolean).join(" & ");
  document.getElementById("inhalt").innerHTML =
    '<div class="card"><div class="meta"><span><b>'+esc(w.titel)+'</b></span>'+
    (zeitraum(w)?'<span>'+esc(zeitraum(w))+'</span>':'')+
    (klNamen?'<span>'+esc(klNamen)+'</span>':'')+
    (pref.jg?'<span>Klasse '+pref.jg+'</span>':'<span>Jahrgang 4–6</span>')+'</div>'+
    (w.thema?'<h2 class="thema">'+esc(w.thema)+'</h2>':'')+
    (w.hinweis?'<div class="hinw">'+esc(w.hinweis)+'</div>':'')+
    bloecke+'<div class="fortschritt">'+fertig+' von '+ges+' Aufgaben erledigt</div></div>';
}
zeige();
</script>
